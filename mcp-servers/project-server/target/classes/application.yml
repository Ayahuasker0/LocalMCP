spring:
  application:
    name: project-mcp-server

  main:
    web-application-type: none
    banner-mode: off

  ai:
    mcp:
      server:
        enabled: true
        name: project-mcp-server
        version: 1.0.0
        type: SYNC
        stdio: true
        annotation-scanner:
          enabled: true

project:
  root: ${PROJECT_ROOT}

logging:
  level:
    root: OFF